name: alphafront
description: "Frontend Flutter de AlphaECI — app de matching social ECI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + inyección de dependencias
  flutter_riverpod: ^2.6.1
  # Cliente HTTP + interceptores
  dio: ^5.7.0
  # Routing declarativo con guards
  go_router: ^14.6.2
  # Almacenamiento seguro de tokens JWT
  flutter_secure_storage: ^9.2.2
  # Igualdad por valor en entidades
  equatable: ^2.0.7
  # Formato de fechas
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
